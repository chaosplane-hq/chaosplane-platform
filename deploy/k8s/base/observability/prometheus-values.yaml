prometheus:
  prometheusSpec:
    retention: 15d
    retentionSize: 45GB
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: gp3
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 50Gi
    nodeSelector:
      nodepool: system
    tolerations:
      - key: CriticalAddonsOnly
        operator: Exists
grafana:
  persistence:
    enabled: true
    size: 10Gi
  nodeSelector:
    nodepool: system
  tolerations:
    - key: CriticalAddonsOnly
      operator: Exists
  smtp:
    enabled: true
    host: email-smtp.ap-northeast-2.amazonaws.com:587
    from_address: grafana@chaosplane.dev
    existingSecret: grafana-smtp-credentials
alertmanager:
  alertmanagerSpec:
    nodeSelector:
      nodepool: system
    tolerations:
      - key: CriticalAddonsOnly
        operator: Exists
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: gp3
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 2Gi
  config:
    global:
      smtp_smarthost: email-smtp.ap-northeast-2.amazonaws.com:587
      smtp_from: alertmanager@chaosplane.dev
      smtp_auth_username_file: /etc/alertmanager/secrets/alertmanager-smtp-credentials/username
      smtp_auth_password_file: /etc/alertmanager/secrets/alertmanager-smtp-credentials/password
      smtp_require_tls: true
    route:
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      receiver: email-critical
      routes:
        - matchers:
            - severity="warning"
          receiver: email-warning
          repeat_interval: 12h
    receivers:
      - name: email-critical
        email_configs:
          - to: critical-alerts@chaosplane.dev
            smarthost: email-smtp.ap-northeast-2.amazonaws.com:587
            from: alertmanager@chaosplane.dev
            auth_username_file: /etc/alertmanager/secrets/alertmanager-smtp-credentials/username
            auth_password_file: /etc/alertmanager/secrets/alertmanager-smtp-credentials/password
            require_tls: true
      - name: email-warning
        email_configs:
          - to: warning-alerts@chaosplane.dev
            smarthost: email-smtp.ap-northeast-2.amazonaws.com:587
            from: alertmanager@chaosplane.dev
            auth_username_file: /etc/alertmanager/secrets/alertmanager-smtp-credentials/username
            auth_password_file: /etc/alertmanager/secrets/alertmanager-smtp-credentials/password
            require_tls: true
    inhibit_rules:
      - source_matchers:
          - severity="critical"
        target_matchers:
          - severity="warning"
        equal:
          - alertname
kubeEtcd:
  enabled: false
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
