apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-northeast-2
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: chaosplane-secrets
  namespace: chaosplane-system
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: chaosplane-secrets
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: chaosplane-prod/db-url
    - secretKey: REDIS_URL
      remoteRef:
        key: chaosplane-prod/redis-url
    - secretKey: JWT_SECRET
      remoteRef:
        key: chaosplane-prod/jwt-secret
    - secretKey: CSRF_SECRET
      remoteRef:
        key: chaosplane-prod/csrf-secret
