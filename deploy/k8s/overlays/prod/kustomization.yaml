apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
images:
  - name: chaosplane-api
    newName: <account>.dkr.ecr.ap-northeast-2.amazonaws.com/chaosplane/api
    newTag: <api-tag>
  - name: chaosplane-web
    newName: <account>.dkr.ecr.ap-northeast-2.amazonaws.com/chaosplane/web
    newTag: <web-tag>
