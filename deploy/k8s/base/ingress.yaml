apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: chaosplane
  namespace: chaosplane-system
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/load-balancer-name: chaosplane-prod
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}]'
    alb.ingress.kubernetes.io/healthcheck-path: /healthz
    alb.ingress.kubernetes.io/conditions.go-api: |
      [{"field":"http-header","httpHeaderConfig":{"httpHeaderName":"X-Site","values":["api"]}}]
    alb.ingress.kubernetes.io/conditions.web: |
      [{"field":"http-header","httpHeaderConfig":{"httpHeaderName":"X-Site","values":["app"]}}]
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: go-api
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 3000
