openapi: 3.1.0
info:
  title: ChaosPlane Platform API
  version: 1.0.0
  description: ChaosPlane Platform API provides chaos engineering capabilities including experiment management, topology discovery,
    vulnerability scanning, resilience scoring, and multi-tenant SaaS features.
  contact:
    name: ChaosPlane Engineering
  license:
    name: Proprietary
servers:
- url: /
  description: Default server
tags:
- name: Health
  description: Health check endpoints
- name: Auth
  description: Authentication and registration
- name: OAuth
  description: OAuth provider authentication
- name: Account
  description: Account management
- name: Onboarding
  description: Onboarding progress and quick setup
- name: Hierarchy
  description: Organization, workspace, team, project, and environment management
- name: Invitations
  description: Team and organization invitations
- name: API Keys
  description: API key management
- name: Agent
  description: Agent registration, heartbeat, and token management
- name: Billing
  description: Subscription and billing management
- name: Notifications
  description: Notification channels and rules
- name: Audit
  description: Audit logs and exports
- name: Topology
  description: Topology snapshots and submission
- name: Topology Analysis
  description: Dependencies, drifts, and metrics
- name: Vulnerabilities
  description: Vulnerability scanning and findings
- name: Suggestions
  description: AI-generated experiment suggestions
- name: Result Analysis
  description: Experiment result analysis
- name: AI Chat
  description: AI-powered chat sessions
- name: Sessions
  description: Active session management
- name: MFA
  description: Multi-factor authentication recovery codes
- name: SAML
  description: SAML SSO provider management
- name: ABAC
  description: Attribute-based access control policies
- name: Game Days
  description: Game day exercises and postmortems
- name: Resilience Score
  description: Environment resilience scoring
- name: Workflow Templates
  description: Chaos experiment workflow templates
- name: Experiments
  description: Chaos experiment CRUD via Kubernetes CRDs
- name: Policies
  description: Chaos policy management via Kubernetes CRDs
- name: Webhooks
  description: Payment gateway webhooks
- name: WebSocket
  description: Real-time experiment status streaming
security: []
paths:
  /healthz:
    get:
      operationId: healthz
      tags:
      - Health
      summary: Liveness probe
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
  /readyz:
    get:
      operationId: readyz
      tags:
      - Health
      summary: Readiness probe (checks DB connectivity)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '503':
          description: Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorWithStatus'
  /auth/register:
    post:
      operationId: authRegister
      tags:
      - Auth
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/login:
    post:
      operationId: authLogin
      tags:
      - Auth
      summary: Login with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '423':
          description: Account locked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/refresh:
    post:
      operationId: authRefresh
      tags:
      - Auth
      summary: Refresh access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Tokens refreshed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/forgot-password:
    post:
      operationId: authForgotPassword
      tags:
      - Auth
      summary: Request password reset token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '200':
          description: Reset token issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordResetTokenResponse'
  /auth/reset-password:
    post:
      operationId: authResetPassword
      tags:
      - Auth
      summary: Reset password using token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '204':
          description: Password reset successful
        '401':
          $ref: '#/components/responses/Unauthorized'
        '410':
          description: Token expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/verify-email:
    post:
      operationId: authVerifyEmail
      tags:
      - Auth
      summary: Verify email address
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyEmailRequest'
      responses:
        '204':
          description: Email verified
        '401':
          $ref: '#/components/responses/Unauthorized'
        '410':
          description: Token expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/resend-verification:
    post:
      operationId: authResendVerification
      tags:
      - Auth
      summary: Resend email verification token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResendVerificationRequest'
      responses:
        '200':
          description: Verification token sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationTokenResponse'
  /auth/invitations/lookup:
    get:
      operationId: invitationLookupByToken
      tags:
      - Invitations
      summary: Lookup invitation details by token
      parameters:
      - name: token
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Invitation details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationByTokenResponse'
        '404':
          $ref: '#/components/responses/NotFound'
  /auth/invitations/accept-by-token:
    post:
      operationId: invitationAcceptByToken
      tags:
      - Invitations
      summary: Accept invitation by token (creates user if needed)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptByTokenRequest'
      responses:
        '200':
          description: Invitation accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invitation'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          description: Token expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/oauth/{provider}/authorize:
    get:
      operationId: oauthAuthorize
      tags:
      - OAuth
      summary: Get OAuth authorization URL
      parameters:
      - name: provider
        in: path
        required: true
        schema:
          type: string
          enum:
          - google
          - github
          - microsoft
      responses:
        '200':
          description: Authorization URL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthAuthorizeResponse'
        '404':
          $ref: '#/components/responses/NotFound'
  /auth/oauth/callback:
    post:
      operationId: oauthCallback
      tags:
      - OAuth
      summary: Handle OAuth callback
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OAuthCallbackRequest'
      responses:
        '200':
          description: OAuth login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/me:
    get:
      operationId: authMe
      tags:
      - Auth
      summary: Get current user info
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/quick-setup:
    post:
      operationId: authQuickSetup
      tags:
      - Onboarding
      summary: Quick setup (creates default org/workspace/team)
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Quick setup completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuickSetupResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/accept-tos:
    post:
      operationId: authAcceptTOS
      tags:
      - Account
      summary: Accept terms of service
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptTOSRequest'
      responses:
        '204':
          description: TOS accepted
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/account/export:
    get:
      operationId: accountExport
      tags:
      - Account
      summary: Export account data (GDPR)
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Account data export
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountExportResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/account:
    delete:
      operationId: accountDelete
      tags:
      - Account
      summary: Delete account
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteAccountRequest'
      responses:
        '204':
          description: Account deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/account/cancel-deletion:
    post:
      operationId: accountCancelDeletion
      tags:
      - Account
      summary: Cancel pending account deletion
      security:
      - BearerAuth: []
      responses:
        '204':
          description: Deletion cancelled
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /auth/logout:
    post:
      operationId: authLogout
      tags:
      - Auth
      summary: Logout (blacklist access token, revoke refresh token)
      security:
      - BearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      responses:
        '204':
          description: Logged out
        '401':
          $ref: '#/components/responses/Unauthorized'
  /agent/register:
    post:
      operationId: agentRegister
      tags:
      - Agent
      summary: Register agent with environment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterAgentRequest'
      responses:
        '200':
          description: Agent registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterAgentResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /agent/heartbeat:
    post:
      operationId: agentHeartbeat
      tags:
      - Agent
      summary: Agent heartbeat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentHeartbeatRequest'
      responses:
        '200':
          description: Heartbeat acknowledged
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentHeartbeatResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /agent/topology:
    post:
      operationId: agentTopologySubmit
      tags:
      - Topology
      summary: Submit topology snapshot from agent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitTopologyRequest'
      responses:
        '201':
          description: Topology submitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopologySnapshot'
  /agent/topology/dependencies:
    post:
      operationId: agentTopologyDependencies
      tags:
      - Topology Analysis
      summary: Submit service dependencies from agent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitDependenciesRequest'
      responses:
        '200':
          description: Dependencies submitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CountResponse'
  /agent/topology/metrics:
    post:
      operationId: agentTopologyMetrics
      tags:
      - Topology Analysis
      summary: Submit environment metrics from agent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitMetricsRequest'
      responses:
        '200':
          description: Metrics submitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CountResponse'
  /agent/topology/drifts:
    post:
      operationId: agentTopologyDrifts
      tags:
      - Topology Analysis
      summary: Submit topology drift from agent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitDriftRequest'
      responses:
        '201':
          description: Drift recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopologyDrift'
  /webhooks/stripe:
    post:
      operationId: webhookStripe
      tags:
      - Webhooks
      summary: Stripe payment webhook
      parameters:
      - name: X-Event-Type
        in: header
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Webhook processed
  /webhooks/toss:
    post:
      operationId: webhookToss
      tags:
      - Webhooks
      summary: Toss payment webhook
      parameters:
      - name: X-Event-Type
        in: header
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Webhook processed
  /webhooks/dodo:
    post:
      operationId: webhookDodo
      tags:
      - Webhooks
      summary: Dodo payment webhook
      parameters:
      - name: X-Event-Type
        in: header
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Webhook processed
  /api/v1/hierarchy:
    get:
      operationId: hierarchyList
      tags:
      - Hierarchy
      summary: List full tenant hierarchy
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Hierarchy tree
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HierarchyResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/organizations:
    post:
      operationId: createOrganization
      tags:
      - Hierarchy
      summary: Create organization
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrganizationRequest'
      responses:
        '201':
          description: Create organization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/organizations/{id}:
    patch:
      operationId: updateOrganization
      tags:
      - Hierarchy
      summary: Update organization
      security:
      - BearerAuth: []
      parameters:
      - $ref: '#/components/parameters/PathId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrganizationRequest'
      responses:
        '200':
          description: Organization updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/workspaces:
    post:
      operationId: createWorkspace
      tags:
      - Hierarchy
      summary: Create workspace
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWorkspaceRequest'
      responses:
        '201':
          description: Create workspace
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/workspaces/{id}:
    patch:
      operationId: updateWorkspace
      tags:
      - Hierarchy
      summary: Update workspace
      security:
      - BearerAuth: []
      parameters:
      - $ref: '#/components/parameters/PathId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateWorkspaceRequest'
      responses:
        '200':
          description: Workspace updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/teams:
    post:
      operationId: createTeam
      tags:
      - Hierarchy
      summary: Create team
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTeamRequest'
      responses:
        '201':
          description: Create team
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Team'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/teams/{id}:
    patch:
      operationId: updateTeam
      tags:
      - Hierarchy
      summary: Update team
      security:
      - BearerAuth: []
      parameters:
      - $ref: '#/components/parameters/PathId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTeamRequest'
      responses:
        '200':
          description: Team updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Team'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/projects:
    post:
      operationId: createProject
      tags:
      - Hierarchy
      summary: Create project
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectRequest'
      responses:
        '201':
          description: Create project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/projects/{id}:
    patch:
      operationId: updateProject
      tags:
      - Hierarchy
      summary: Update project
      security:
      - BearerAuth: []
      parameters:
      - $ref: '#/components/parameters/PathId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProjectRequest'
      responses:
        '200':
          description: Project updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/environments:
    post:
      operationId: createEnvironment
      tags:
      - Hierarchy
      summary: Create environment
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEnvironmentRequest'
      responses:
        '201':
          description: Create environment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Environment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/environments/{id}:
    patch:
      operationId: updateEnvironment
      tags:
      - Hierarchy
      summary: Update environment
      security:
      - BearerAuth: []
      parameters:
      - $ref: '#/components/parameters/PathId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateEnvironmentRequest'
      responses:
        '200':
          description: Environment updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Environment'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/onboarding:
    get:
      operationId: onboardingGet
      tags:
      - Onboarding
      summary: Get onboarding progress
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Onboarding progress
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnboardingProgress'
    patch:
      operationId: onboardingUpdate
      tags:
      - Onboarding
      summary: Update onboarding steps
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOnboardingRequest'
      responses:
        '200':
          description: Progress updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnboardingProgress'
  /api/v1/onboarding/skip:
    post:
      operationId: onboardingSkip
      tags:
      - Onboarding
      summary: Skip onboarding
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Onboarding skipped
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnboardingProgress'
  /api/v1/onboarding/complete:
    post:
      operationId: onboardingComplete
      tags:
      - Onboarding
      summary: Mark onboarding complete
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Onboarding completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnboardingProgress'
  /api/v1/agents/test-connection:
    post:
      operationId: testAgentConnection
      tags:
      - Onboarding
      summary: Test agent connection
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TestAgentConnectionRequest'
      responses:
        '200':
          description: Test agent connection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestAgentConnectionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/invitations:
    get:
      operationId: invitationsList
      tags:
      - Invitations
      summary: List invitations
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Invitations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListInvitationsResponse'
    post:
      operationId: invitationsCreate
      tags:
      - Invitations
      summary: Create invitation
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInvitationRequest'
      responses:
        '201':
          description: Create invitation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invitation'
        '400':
