apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: go-api
  namespace: chaosplane-system
spec:
  scaleTargetRef:
    name: go-api
  minReplicaCount: 2
  maxReplicaCount: 30
  triggers:
    - type: prometheus
      metadata:
        serverAddress: http://prometheus-server.monitoring.svc.cluster.local
        metricName: go_api_request_rate
        threshold: "100"
        query: sum(rate(http_requests_total{app="go-api"}[1m]))
    - type: cpu
      metadata:
        type: Utilization
        value: "70"
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: web
  namespace: chaosplane-system
spec:
  scaleTargetRef:
    name: web
  minReplicaCount: 2
  maxReplicaCount: 20
  triggers:
    - type: cpu
      metadata:
        type: Utilization
        value: "65"
    - type: memory
      metadata:
        type: Utilization
        value: "75"
