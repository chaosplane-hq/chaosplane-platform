apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    targetRevision: 0.10.7
    helm:
      valuesObject:
        installCRDs: true
        nodeSelector:
          nodepool: system
        tolerations:
          - key: CriticalAddonsOnly
            operator: Exists
        webhook:
          nodeSelector:
            nodepool: system
          tolerations:
            - key: CriticalAddonsOnly
              operator: Exists
        certController:
          nodeSelector:
            nodepool: system
          tolerations:
            - key: CriticalAddonsOnly
              operator: Exists
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
