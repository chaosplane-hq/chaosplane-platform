apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-api
  namespace: chaosplane-system
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: go-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: go-api
    spec:
      serviceAccountName: chaosplane-api
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: go-api
      containers:
        - name: go-api
          image: chaosplane-api:placeholder
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              memory: 128Mi
              cpu: 100m
            limits:
              memory: 512Mi
              cpu: 500m
          envFrom:
            - secretRef:
                name: chaosplane-secrets
