apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fluent-bit
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://aws.github.io/eks-charts
    chart: aws-for-fluent-bit
    targetRevision: 0.2.0
    helm:
      valuesObject:
        serviceAccount:
          create: true
          name: fluent-bit
        cloudWatchLogs:
          enabled: true
          region: ap-northeast-2
          logGroupName: /aws/eks/chaosplane-prod/application
          logStreamPrefix: pod-
          autoCreateGroup: true
        input:
          memBufLimit: 5MB
        filter:
          mergeLog: true
          keepLog: false
        tolerations:
          - key: CriticalAddonsOnly
            operator: Exists
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
