apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
  namespace: chaosplane-system
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      serviceAccountName: chaosplane-api
      restartPolicy: Never
      containers:
        - name: migrate
          image: chaosplane-api:placeholder
          command:
            - migrate
          envFrom:
            - secretRef:
                name: chaosplane-secrets
