apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: chaosplane-system
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/chaosplane-hq/chaosplane-platform.git
    targetRevision: HEAD
    path: deploy/k8s/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: chaosplane-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
